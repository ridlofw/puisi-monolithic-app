# klaster tiga node, ditemukan lewat daftar statis
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

# topologi bersama, lihat kontrak/README.md
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json

# quorum queue yang dibuat sebelum semua node bergabung ditambah anggotanya sampai tiga
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 3
quorum_queue.continuous_membership_reconciliation.trigger_interval = 10000

# sisi minoritas berhenti saat jaringan terbelah, mencegah split brain
cluster_partition_handling = pause_minority
