# RabbitMQ SATU node untuk versi Single (deploy/aws/1server/compose.yaml).
# Bedanya dengan rabbitmq/rabbitmq.conf (klaster 3 node): tidak ada daftar node lain, dan quorum queue
# cukup satu anggota. Topologi (exchange, queue, binding) tetap dari rabbitmq/definitions.json yang sama.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
