# Disalin ke /etc/nginx/rute/00-swarm.conf oleh deploy/swarm/Dockerfile.gateway.
# Disertakan di dalam blok `server {}` oleh gateway/nginx.conf (include rute/*.conf).
# Ini BUKAN bagian dari gateway/rute milik Pison. Usulan agar Pison mengadopsinya
# ada di USULAN-PEMILIK.md.

# 1) Health check untuk load balancer (ALB) dan healthcheck Swarm.
#    Tidak menyentuh layanan lain, jadi tetap 200 selama Nginx hidup.
location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
}

# 2) IP klien asli. ALB menaruh IP klien di X-Forwarded-For. Tanpa ini $remote_addr
#    adalah IP ALB, dan zona limit_req `auth_login` (kunci $binary_remote_addr)
#    menjadi SATU ember untuk SEMUA pengguna: login ke-7 dalam semenit dari siapa
#    pun mendapat 429. Hanya alamat privat yang dipercaya sebagai proxy; klien dari
#    internet tidak bisa memalsukan header ini karena server hanya dijangkau ALB.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
