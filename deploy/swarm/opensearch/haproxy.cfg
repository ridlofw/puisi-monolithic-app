# Pintu masuk tunggal ke klaster OpenSearch 3 node (Swarm config untuk layanan `opensearch`).
# Klien (search-service, search-consumer) hanya mengenal SATU alamat, http://opensearch:9200
# (OPENSEARCH_URL tidak diubah). HAProxy membagi permintaan ke opensearch-1..3 dan
# berhenti mengirim ke node yang gagal pemeriksaan kesehatan. Nama node dicari ulang lewat
# DNS Docker, jadi alamat baru setelah node dijadwalkan ulang terbaca tanpa restart.
global
    maxconn 512

defaults
    mode http
    timeout connect 2s
    timeout client  30s
    timeout server  30s
    retries 2
    option redispatch

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend masuk
    bind :9200
    default_backend node_opensearch

backend node_opensearch
    balance roundrobin
    option httpchk GET /_cluster/health?local=true
    http-check expect status 200
    default-server check inter 3s fall 2 rise 2 resolvers docker init-addr none
    server os1 opensearch-1:9200
    server os2 opensearch-2:9200
    server os3 opensearch-3:9200
