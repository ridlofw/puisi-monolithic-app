# infrastruktur bersama, selalu menyala tanpa profile. Pemilik: Pison
services:
  # dua gateway aktif-pasif: keepalived memindahkan VIP 10.231.0.10 ke gateway-2 bila gateway mati.
  # Port host tetap terikat ke satu container di Docker Desktop, jadi gateway-2 juga dibuka di 8081;
  # di host Linux dengan network_mode host, VIP itulah alamat yang dipakai pengguna
  gateway: &gateway
    build: ./gateway
    image: puisi-gateway:lokal
    ports:
      - "80:80"
    cap_add: [NET_ADMIN, NET_RAW, NET_BROADCAST]
    environment:
      GW_NAMA: gateway-1
      GW_STATUS: MASTER
      GW_PRIORITAS: "150"
      GW_SELF: 10.231.0.11
      GW_PEER: 10.231.0.12
      GW_VIP: 10.231.0.10
    networks:
      default: {}
      gateway-ha:
        ipv4_address: 10.231.0.11
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/proxy-umum.conf:/etc/nginx/proxy-umum.conf:ro
      - ./gateway/rute:/etc/nginx/rute:ro
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped

  gateway-2:
    <<: *gateway
    ports:
      - "8081:80"
    environment:
      GW_NAMA: gateway-2
      GW_STATUS: BACKUP
      GW_PRIORITAS: "100"
      GW_SELF: 10.231.0.12
      GW_PEER: 10.231.0.11
      GW_VIP: 10.231.0.10
    networks:
      default: {}
      gateway-ha:
        ipv4_address: 10.231.0.12

  rabbitmq-1: &rabbitmq
    image: rabbitmq:4-management
    hostname: rabbitmq-1
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE:-puisi-cookie-lokal}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-1:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  rabbitmq-2:
    <<: *rabbitmq
    hostname: rabbitmq-2
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-2:/var/lib/rabbitmq
    ports:
      - "15673:15672"

  rabbitmq-3:
    <<: *rabbitmq
    hostname: rabbitmq-3
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-3:/var/lib/rabbitmq
    ports:
      - "15674:15672"

  # Redis Sentinel: 1 master, 2 replika, 3 Sentinel. Bila master mati, Sentinel mempromosikan replika dalam
  # hitungan detik. Masih cache murni tanpa persistensi; aplikasi tetap jalan walau semua node Redis mati.
  # Semua memakai IP tetap di jaringan redis-ha, bukan nama host: Sentinel masuk mode TILT (tidak mau failover)
  # bila nama node yang berhenti tidak bisa di-resolve, dan PHP menunggu sekitar 4 detik untuk nama yang hilang.
  redis-1: &redis
    image: redis:7-alpine
    command: ["sh", "/mulai.sh", "node", "10.231.1.11"]
    environment: &redis-env
      REDIS_NODE: 10.231.1.11 10.231.1.12 10.231.1.13
      REDIS_SENTINEL: 10.231.1.21 10.231.1.22 10.231.1.23
    volumes:
      - ./redis/mulai.sh:/mulai.sh:ro
    networks:
      default: {}
      redis-ha:
        ipv4_address: 10.231.1.11
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-2:
    <<: *redis
    command: ["sh", "/mulai.sh", "node", "10.231.1.12"]
    networks:
      default: {}
      redis-ha:
        ipv4_address: 10.231.1.12

  redis-3:
    <<: *redis
    command: ["sh", "/mulai.sh", "node", "10.231.1.13"]
    networks:
      default: {}
      redis-ha:
        ipv4_address: 10.231.1.13

  redis-sentinel-1: &sentinel
    image: redis:7-alpine
    command: ["sh", "/mulai.sh", "sentinel", "10.231.1.21"]
    environment: *redis-env
    volumes:
      - ./redis/mulai.sh:/mulai.sh:ro
    networks:
      default: {}
      redis-ha:
        ipv4_address: 10.231.1.21
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      redis-1:
        condition: service_healthy
    restart: unless-stopped

  redis-sentinel-2:
    <<: *sentinel
    command: ["sh", "/mulai.sh", "sentinel", "10.231.1.22"]
    networks:
      default: {}
      redis-ha:
        ipv4_address: 10.231.1.22

  redis-sentinel-3:
    <<: *sentinel
    command: ["sh", "/mulai.sh", "sentinel", "10.231.1.23"]
    networks:
      default: {}
      redis-ha:
        ipv4_address: 10.231.1.23

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt

volumes:
  rabbitmq-1:
  rabbitmq-2:
  rabbitmq-3:

networks:
  # jaringan kecil bersubnet tetap untuk VRRP; puisi_default tetap memakai subnet otomatis Docker
  gateway-ha:
    ipam:
      config:
        - subnet: 10.231.0.0/24
  # IP tetap Redis .11-.23; IP otomatis untuk klien hanya dari .128 ke atas supaya tidak bertabrakan
  redis-ha:
    ipam:
      config:
        - subnet: 10.231.1.0/24
          ip_range: 10.231.1.128/25
