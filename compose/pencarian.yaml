# search-service dan OpenSearch. Pemilik: Evan
# setiap service diberi profiles: ["pencarian", "semua"], lihat kontrak/README.md
services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    profiles: ["pencarian", "semua"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"       # hanya untuk lokal
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  search-service:
    build: ./services/pencarian
    networks: [default, redis-ha]
    profiles: ["pencarian", "semua"]
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_HOSTS: 10.231.1.11:6379,10.231.1.12:6379,10.231.1.13:6379
      REDIS_SENTINELS: 10.231.1.21:26379,10.231.1.22:26379,10.231.1.23:26379
    depends_on:
      opensearch:
        condition: service_healthy

  # mengonsumsi q.pencarian-indeks dan menjaga indeks tetap sinkron dengan event
  search-consumer:
    build: ./services/pencarian
    networks: [default, redis-ha]
    profiles: ["pencarian", "semua"]
    restart: unless-stopped
    command: ["php", "bin/consumer.php"]
    # setiap update menunggu refresh indeks sekitar 1 s, jadi throughput dinaikkan dengan consumer paralel
    deploy:
      replicas: 3
    healthcheck:
      disable: true   # HEALTHCHECK image memeriksa HTTP, consumer tidak punya server HTTP
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_HOSTS: 10.231.1.11:6379,10.231.1.12:6379,10.231.1.13:6379
      REDIS_SENTINELS: 10.231.1.21:26379,10.231.1.22:26379,10.231.1.23:26379
      AMQP_URLS: amqp://puisi:puisi@rabbitmq-1:5672/%2F,amqp://puisi:puisi@rabbitmq-2:5672/%2F,amqp://puisi:puisi@rabbitmq-3:5672/%2F
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
