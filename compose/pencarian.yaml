# search-service dan OpenSearch. Pemilik: Evan
# setiap service diberi profiles: ["pencarian", "semua"], lihat kontrak/README.md
services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    profiles: ["pencarian", "semua"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"       # hanya untuk lokal
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  search-service:
    build: ./services/pencarian
    profiles: ["pencarian", "semua"]
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
