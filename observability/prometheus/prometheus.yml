global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # Penemuan otomatis worker melalui Docker label (metrics.scrape=true dan metrics.port)
  # Docker DNS mengembalikan IP setiap replika, jadi DNS SD menemukan semua instans tanpa docker.sock,
  # yang ditolak di Docker Desktop Windows dan membuat panel worker kosong. Nama yang belum menyala diabaikan.
  - job_name: "worker"
    dns_sd_configs:
      - names: ["auto-tagging", "klasifikasi-genre", "text-to-speech", "analisis-emosi",
                "poem-relay", "poem-consumer", "worker-templat"]
        type: A
        port: 9100
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: layanan

  # metrik poem-service dibagi semua replika lewat Redis, jadi query memakai max by, bukan sum
  - job_name: "poem-service"
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["poem-service"]
        type: A
        port: 8080
        refresh_interval: 15s

  - job_name: "rabbitmq"
    static_configs:
      - targets:
          - "rabbitmq-1:15692"
          - "rabbitmq-2:15692"
          - "rabbitmq-3:15692"

  # Nginx Prometheus Exporter
  - job_name: "nginx-exporter"
    static_configs:
      - targets:
          - "nginx-exporter:9113"

  # Redis Exporter
  - job_name: "redis-exporter"
    static_configs:
      - targets:
          - "redis-exporter:9121"

  # cAdvisor untuk utilitas CPU dan Memori kontainer
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

  # Blackbox Exporter untuk probe ketersediaan dan latensi SLO gateway
  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 15s
    static_configs:
      - targets:
          - "http://gateway/api/puisi"
          - "http://gateway/api/search"
          - "http://gateway-2/sehat-gateway"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"
