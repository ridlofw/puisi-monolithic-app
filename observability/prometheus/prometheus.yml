global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # Penemuan otomatis worker melalui Docker label (metrics.scrape=true dan metrics.port)
  - job_name: "docker-containers"
    docker_sd_configs:
      - host: "unix:///var/run/docker.sock"
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_metrics_scrape]
        regex: "true"
        action: keep
      - source_labels: [__address__, __meta_docker_container_label_metrics_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: ${1}:${2}
        target_label: __address__
      - source_labels: [__meta_docker_container_name]
        regex: /?(.*)
        target_label: container

  # Metrik RabbitMQ bawaan klaster
  - job_name: "rabbitmq"
    static_configs:
      - targets:
          - "rabbitmq-1:15692"
          - "rabbitmq-2:15692"
          - "rabbitmq-3:15692"

  # Nginx Prometheus Exporter
  - job_name: "nginx-exporter"
    static_configs:
      - targets:
          - "nginx-exporter:9113"

  # Redis Exporter
  - job_name: "redis-exporter"
    static_configs:
      - targets:
          - "redis-exporter:9121"

  # cAdvisor untuk utilitas CPU dan Memori kontainer
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

  # Blackbox Exporter untuk probe ketersediaan dan latensi SLO gateway
  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 15s
    static_configs:
      - targets:
          - "http://gateway/api/puisi"
          - "http://gateway/api/search"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"
