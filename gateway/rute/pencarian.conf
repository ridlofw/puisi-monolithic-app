# search-service. Pemilik: Evan
location /api/search {
    set $pencarian http://search-service:8080;
    proxy_pass $pencarian;
    include /etc/nginx/proxy-umum.conf;

    # key memuat query string lewat $request_uri, jadi tiap kombinasi q, genre, tag, hal punya entri sendiri
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 10s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
}
