# Auth responses are never cached. Rate limit login attempts per client IP.
location ~ ^/api/auth/login/?$ {
    set $auth http://auth-service:8080;
    limit_req zone=auth_login burst=5 nodelay;
    limit_req_status 429;
    error_page 429 = @auth_rate_limited;
    proxy_pass $auth;
    include /etc/nginx/proxy-umum.conf;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

location @auth_rate_limited {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Request-ID $request_id always;
    return 429 '{"status":"error","pesan":"Terlalu banyak percobaan login. Coba lagi nanti."}';
}

location /api/auth/ {
    set $auth http://auth-service:8080;
    proxy_pass $auth;
    include /etc/nginx/proxy-umum.conf;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
