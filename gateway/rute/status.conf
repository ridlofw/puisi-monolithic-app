# Endpoint stub_status untuk scraping Nginx Prometheus Exporter.
# Dibatasi khusus untuk localhost dan subnet jaringan internal Docker.
location = /stub_status {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
}
