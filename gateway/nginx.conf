worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 2m;

    # alamat layanan dicari saat request, jadi gateway tetap hidup walau layanannya belum dijalankan
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                     max_size=100m inactive=10m use_temp_path=off;

    log_format jejak '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'rid=$request_id up=$upstream_addr rt=$request_time '
                     'urt=$upstream_response_time cache=$upstream_cache_status';
    access_log /dev/stdout jejak;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        add_header X-Request-ID $request_id always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Request-ID $request_id always;
        }

        # jawaban untuk /api yang layanannya belum dipasang atau belum dijalankan
        location /api/ {
            default_type application/json;
            return 503 '{"status":"error","pesan":"Layanan untuk rute ini belum dijalankan."}';
        }

        # layanan di balik rute ada tetapi tidak menjawab, tetap balas JSON agar frontend bisa membacanya
        error_page 502 504 = @tidak_tersedia;
        location @tidak_tersedia {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            return 503 '{"status":"error","pesan":"Layanan sedang tidak tersedia."}';
        }

        # satu berkas per layanan, ditulis pemilik layanannya
        include /etc/nginx/rute/*.conf;
    }
}
