worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 2m;

    # alamat layanan dicari saat request, jadi gateway tetap hidup walau layanannya belum dijalankan
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                     max_size=100m inactive=10m use_temp_path=off;
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

    # throttling di pintu depan (Bab 11.5.2): kirim puisi dan pencarian dibatasi per IP.
    # Kunci kosong tidak dihitung, jadi GET galeri yang sudah ditahan cache tidak ikut dibatasi
    map $request_method $kunci_kirim {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $kunci_kirim        zone=kirim_puisi:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=cari:10m       rate=30r/s;

    log_format jejak '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'rid=$request_id up=$upstream_addr rt=$request_time '
                     'urt=$upstream_response_time cache=$upstream_cache_status';
    access_log /dev/stdout jejak;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        add_header X-Request-ID $request_id always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Request-ID $request_id always;
        }

        # jawaban untuk /api yang layanannya belum dipasang atau belum dijalankan
        location /api/ {
            default_type application/json;
            return 503 '{"status":"error","pesan":"Layanan untuk rute ini belum dijalankan."}';
        }

        # layanan di balik rute ada tetapi tidak menjawab, tetap balas JSON agar frontend bisa membacanya
        error_page 502 504 = @tidak_tersedia;
        location @tidak_tersedia {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            return 503 '{"status":"error","pesan":"Layanan sedang tidak tersedia."}';
        }

        location @dibatasi {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            add_header Retry-After 1 always;
            return 429 '{"status":"error","pesan":"Terlalu banyak permintaan, coba lagi sebentar lagi."}';
        }

        # cek kesehatan keepalived dan probe, tidak dicatat agar log tidak penuh
        location = /sehat-gateway {
            access_log off;
            default_type application/json;
            return 200 '{"status":"sukses","pesan":"Gateway sehat."}';
        }

        # satu berkas per layanan, ditulis pemilik layanannya
        include /etc/nginx/rute/*.conf;
    }
}
